[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinfo_qml"
version = "1.0.0"
description = "Quantum-Enhanced Genetic Variant Pathogenicity Prediction"
authors = [
    { name = "Antigravity", email = "antigravity@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "torch",
    "pennylane",
    "xgboost",
    "matplotlib",
    "seaborn",
    "requests",
    "pysam",
    "tqdm",
    "joblib",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "black",
    "flake8",
    "isort"
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
